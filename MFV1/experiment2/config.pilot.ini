####################### Memory & Forecasting -- Pilot Configuration ###########
#
# A smaller Prolific pilot: 40 participants (20 at rho=0.6, 20 at rho=0.7)
# instead of the full 300. Everything else -- task timing (80 rounds, 20
# observation rounds), the scoring rule, the payment schedule, and server
# behavior -- is identical to config.ini. Only the participant count, the
# stimuli file, and the database are different, so pilot data is never mixed
# with the full study's.
#
# Use it by pointing CONFIG_PATH at this file instead of editing config.ini:
#
#     CONFIG_PATH=config.pilot.ini python run.py
#     CONFIG_PATH=config.pilot.ini python scripts/export_data.py --out db_exports/pilot40.csv
#     CONFIG_PATH=config.pilot.ini python scripts/pay_bonuses.py
#
# The stimuli file (static/data/assignments_pilot.json) was generated with:
#
#     python scripts/generate_assignments.py \
#         --num-participants 40 \
#         --output static/data/assignments_pilot.json \
#         --seed "20260904-pilot40-rho-conditioned"
#
# See config.ini for what every setting below does; only the differences from
# it are called out here.

############################### Server Parameters ##############################
[Server Parameters]
host = 0.0.0.0
# A different port from config.ini's 22362, so the pilot and the full study
# can be run as two separate local processes at once if needed.
port = 22363

# A separate database file, so pilot data can never end up in the same table
# as the full study's 300 participants (or vice versa).
database_url = sqlite:///prolific_pilot.db

secret_key =

logfile = experiment_pilot.log
loglevel = info

workers = 2
threads = 4

server_url =

################################### Prolific ###################################
[Prolific]
# Set these from the Prolific study you create for the pilot -- they should be
# different codes from the ones on the full-study Prolific listing, so pilot
# and main-study submissions can't be confused with each other.
completion_code =
screenout_code =

completion_url_base = https://app.prolific.com/submissions/complete

api_token =
study_id =

################################ Task Parameters ###############################
[Task Parameters]
# Distinct from the full study's 3.0.0, so exports and analyses can tell the
# two cohorts apart even after they end up in the same place.
experiment_code_version = 3.0.0-pilot40

# 40 instead of 300. Must match the file below and the --num-participants used
# to generate it (20 participants per rho requires num_counters divisible by
# 4, since the design is rho x start_type = 2 x 2 cells).
num_counters = 40

# The smaller, separately-generated pilot stimuli file. static/data/assignments.json
# (the full 300-participant file) is untouched.
assignments_filename = data/assignments_pilot.json

num_conds = 1

contact_email_on_error = kahanalab@gmail.com

browser_exclude_rule = MSIE, mobile, tablet

allow_repeats = false

cutoff_time = 90

# false: this pilot is meant to run on Prolific with real participants, not
# be opened without a Prolific ID. Set to true temporarily if you want to
# click through it locally first (see the README).
allow_debug_mode = false

##################################### Payment ##################################
[Payment]
# Same payment schedule as the full study -- the pilot should look and pay
# exactly like the real thing, since that is what it's meant to test.
flat_fee_dollars = 3.00
expected_bonus_dollars = 4.00
expected_score_for_payment = 2000
max_bonus_dollars = 8.00

################################### Experiment #################################
[Experiment]
# Unchanged from config.ini: the pilot runs the full 80-round task, not a
# shortened one. Only the sample size and rho-balance differ from the main
# study.
forecast_start_index = 20
max_trials = 80
distractor_length_ms = 4000
score_sd = 20
min_ar_value = 1
max_ar_value = 1000
debug_slot =
