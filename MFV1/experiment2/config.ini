####################### Memory & Forecasting -- Prolific Configuration ########
#
# This file replaces the psiTurk `config.txt`. Anything secret (API tokens,
# secret keys, database URLs) can be left blank here and supplied instead
# through the environment or a `.env` file -- environment variables always win.
# See `.env.example`.
#

############################### Server Parameters ##############################
[Server Parameters]
# Interface the server listens on. Use 0.0.0.0 behind a reverse proxy.
host = 0.0.0.0
port = 22362

# Where participant data is stored. SQLite is fine for a single-server study;
# for a multi-worker cloud deployment point this at Postgres instead, e.g.
#     database_url = postgresql+psycopg://user:pass@host/dbname
# Overridden by the DATABASE_URL environment variable when that is set.
#
# Deliberately not `participants.db` -- that is the psiTurk pilot database, and
# pointing the server at it would mix the new tables into the old file.
database_url = sqlite:///prolific.db

# Flask secret key. Leave blank here and set SECRET_KEY in the environment.
secret_key =

# Server-side log file. Set to `-` to log to stdout (what you want on Heroku,
# Fly, Render, etc.). Deliberately not `server.log` -- that is the old psiTurk
# log and is already gigabytes long.
logfile = experiment.log
loglevel = info

# Number of gunicorn workers and threads used by `python run.py --production`.
workers = 2
threads = 4

# Public URL of this server, used to build the consent/experiment links you
# paste into Prolific. Leave blank to infer it from the incoming request.
server_url =

################################### Prolific ###################################
[Prolific]
# The completion codes you created in the Prolific study builder.
#   completion_code -- participant finished the whole task
#   screenout_code  -- participant failed the attention/competency check
# Set these before going live. PROLIFIC_COMPLETION_CODE and
# PROLIFIC_SCREENOUT_CODE environment variables override them.
completion_code =
screenout_code =

# Where participants are sent when they finish. You should not need to change
# this unless Prolific changes their submission endpoint.
completion_url_base = https://app.prolific.com/submissions/complete

# Used by scripts/pay_bonuses.py. Set PROLIFIC_API_TOKEN in the environment
# rather than writing the token here.
api_token =
study_id =

################################ Task Parameters ###############################
[Task Parameters]
# Logged with every participant. Bump this when the task changes so analyses
# can separate code versions.
#
# 3.0.0 -- AR(1) series are now conditioned so their realized rho lands within
#          0.01 of the nominal value. Stimuli differ from earlier versions, so
#          data collected under 2.x and under the psiTurk build are not
#          comparable. Those cohorts use static/data/assignments_v1.json.
experiment_code_version = 3.0.0

# Number of counterbalance slots. Must match --num-participants in
# scripts/generate_assignments.py and the number of entries in the file below.
num_counters = 300

# Which pre-generated stimuli file to serve, relative to static/. Must be kept
# in sync with num_counters above. A separately-generated file (e.g. a smaller
# pilot batch -- see config.pilot.ini) can be pointed to here instead of
# overwriting or subsetting the main file.
assignments_filename = data/assignments.json

# Number of treatment conditions (this study varies everything through the
# counterbalance slot, so there is a single condition).
num_conds = 1

contact_email_on_error = kahanalab@gmail.com

# Comma-delimited list checked against the request's user agent. Values
# understood as `user_agents` properties: mobile, tablet, touchcapable, pc,
# bot, safari. Anything else is matched against the raw user agent string.
browser_exclude_rule = MSIE, mobile, tablet

# Whether a Prolific participant may take the study more than once. Prolific
# already prevents this for a single study; this additionally blocks anyone
# who completed an earlier study using the same database.
allow_repeats = false

# Minutes a participant may hold a counterbalance slot without finishing before
# the slot is released back into the pool.
cutoff_time = 90

# Set to true to allow visiting /exp without Prolific query parameters, using a
# generated debug participant id. Never leave this on for a live study.
allow_debug_mode = true

##################################### Payment ##################################
[Payment]
# Base payment set on the Prolific study. Shown to the participant and recorded
# with their data; Prolific pays it, not this server.
flat_fee_dollars = 3.00

# Bonus schedule. bonus = expected_bonus_dollars * score / expected_score_for_payment,
# capped at max_bonus_dollars.
expected_bonus_dollars = 4.00
expected_score_for_payment = 2000
max_bonus_dollars = 8.00

################################### Experiment #################################
[Experiment]
# Round index at which the passive observation phase ends and forecasting
# begins. Set to a small number (e.g. 2) when piloting.
forecast_start_index = 20

# Total number of rounds. Must not exceed the number of AR(1) values per
# assignment in the file named by assignments_filename above.
max_trials = 80

# How long each distractor block runs, in milliseconds.
distractor_length_ms = 4000

# Scoring rule parameters: points = round(100 * max(0, 1 - |forecast - actual| / score_sd))
score_sd = 20

# Bounds of the AR(1) process, used for the on-screen ruler.
min_ar_value = 1
max_ar_value = 1000

# Force a specific counterbalance slot for debugging. Leave blank for normal
# balanced assignment.
debug_slot =
